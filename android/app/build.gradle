plugins {
    id 'com.android.application'
}

def configuredForgeUrl = providers.gradleProperty('FORGE_DEFAULT_URL').getOrElse('')
def escapedForgeUrl = configuredForgeUrl.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.authorsforge.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.authorsforge.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'FORGE_DEFAULT_URL', '"' + escapedForgeUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
