services:
  - type: pserv
    name: kings-ai-router
    runtime: node
    repo: https://github.com/kevinmfwakley23-ux/-KINGS-AI
    branch: main
    plan: 0.5c-512mb
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: node build/runtimes/app-router/server.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: KINGS_APP_ROUTER_BIND
        value: 0.0.0.0
      - key: KINGS_APP_ROUTER_PORT
        value: "10000"
      - key: KINGS_APP_ROUTER_TOKEN
        generateValue: true
      - key: KINGS_APP_ROUTER_PROVIDER_ORDER
        value: omniroute,9router
      # At least one real upstream gateway must be configured for a fresh hosted
      # K.I.N.G.S. router to have a routable model. Existing Render services keep
      # any manually configured values when the Blueprint is synced.
      - key: KINGS_OMNIROUTE_BASE_URL
        sync: false
      - key: KINGS_OMNIROUTE_API_KEY
        sync: false
      - key: KINGS_9ROUTER_BASE_URL
        sync: false
      - key: KINGS_9ROUTER_API_KEY
        sync: false

  - type: web
    name: authors-forge
    runtime: docker
    repo: https://github.com/kevinmfwakley23-ux/Author-s-Forge
    branch: main
    plan: 0.5c-512mb
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: FORGE_ACCESS_TOKEN
        sync: false
      - key: FORGE_DATA_DIR
        value: /var/data/authors-forge
      - key: FORGE_REQUIRE_HTTPS
        value: "1"
      - key: FORGE_SECURE_COOKIE
        value: "1"
      - key: AI_PROVIDER_ORDER
        value: kings,omniroute,9router,openrouter,openai
      - key: KINGS_AI_RESPONSES_URL
        fromService:
          type: pserv
          name: kings-ai-router
          property: hostport
      - key: KINGS_AI_API_KEY
        fromService:
          type: pserv
          name: kings-ai-router
          envVarKey: KINGS_APP_ROUTER_TOKEN
      - key: KINGS_AI_MODEL
        value: auto
      - key: KINGS_AI_BILLING_CLASS
        value: gateway-managed
      - key: KINGS_AI_TIMEOUT_MS
        value: "65000"
      # Direct OmniRoute is an optional fallback for Forge. It does not replace
      # K.I.N.G.S.; the provider order above prefers the K.I.N.G.S. router first.
      - key: OMNIROUTE_BASE_URL
        sync: false
      - key: OMNIROUTE_API_KEY
        sync: false
    disk:
      name: forge-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: kings-collectors-kingdom
    runtime: node
    repo: https://github.com/kevinmfwakley23-ux/K.I.N.G.S.-COLLECTORS-KINGDOM
    branch: main
    plan: 0.5c-512mb
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: KINGDOM_HOST
        value: 0.0.0.0
      - key: KINGDOM_PORT
        value: "10000"
      - key: KINGDOM_DATA_DIR
        value: /var/data/kings-collectors-kingdom
      - key: KINGDOM_COOKIE_SECURE
        value: "true"
      - key: KINGDOM_KINGS_AI_HOSTPORT
        fromService:
          type: pserv
          name: kings-ai-router
          property: hostport
      - key: KINGDOM_KINGS_AI_TOKEN
        fromService:
          type: pserv
          name: kings-ai-router
          envVarKey: KINGS_APP_ROUTER_TOKEN
    disk:
      name: kingdom-data
      mountPath: /var/data
      sizeGB: 1
