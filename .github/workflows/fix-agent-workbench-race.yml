name: Fix Agent Workbench Race

on:
  push:
    branches:
      - chief-engineer/fix-agent-workbench-autonomous-race

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Patch stale-DOM race guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/studio-agent-workbench-browser-acceptance.js')
          text = path.read_text()
          old = '''    await page.locator("#agent-mode").selectOption("autonomous");
    await page.locator("#agent-goal").fill("Draft and continuity edit this scene, grounded in the current project truth.");
    await page.locator("#agent-form button[type=submit]").tap();
    await page.waitForFunction(() => document.querySelector('[data-tool-id="project.context"]') && document.querySelector('[data-tool-id="editing.analyze"]'));
    assert.equal((await api(base, `/api/projects/${PROJECT_ID}/collaboration`)).mode, "autonomous");
    assert.match(await page.locator(".agent-group-run").innerText(), /2 safe read-only steps/);
'''
          new = '''    await page.locator("#agent-mode").selectOption("autonomous");
    await page.locator("#agent-goal").fill("Draft and continuity edit this scene, grounded in the current project truth.");
    await page.locator("#agent-form button[type=submit]").tap();
    await page.waitForFunction(async (projectId) => {
      const response = await fetch(`/api/projects/${encodeURIComponent(projectId)}/collaboration`);
      if (!response.ok) return false;
      const collaboration = await response.json().catch(() => ({}));
      return collaboration.mode === "autonomous";
    }, PROJECT_ID);
    await page.waitForFunction(() => {
      const status = document.querySelector("#agent-status")?.textContent || "";
      const group = document.querySelector(".agent-group-run")?.textContent || "";
      return /governed workflow steps planned/i.test(status) && /2 safe read-only steps/i.test(group);
    });
    assert.equal((await api(base, `/api/projects/${PROJECT_ID}/collaboration`)).mode, "autonomous");
    assert.match(await page.locator(".agent-group-run").innerText(), /2 safe read-only steps/);
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one race-prone Autonomous block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run targeted Agent Workbench browser acceptance twice
        run: |
          node scripts/studio-agent-workbench-browser-acceptance.js
          node scripts/studio-agent-workbench-browser-acceptance.js
      - name: Commit verified fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-agent-workbench-race.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/studio-agent-workbench-browser-acceptance.js .github/workflows/fix-agent-workbench-race.yml
          git commit -m "Fix Agent Workbench autonomous acceptance race"
          git push origin HEAD:${GITHUB_REF_NAME}
