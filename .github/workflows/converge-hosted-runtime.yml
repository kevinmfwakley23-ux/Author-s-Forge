name: Converge Hosted Runtime

# One-time release convergence helper. Remove before final merge.
on:
  push:
    branches:
      - chief/android-ps5-web-runtime
    paths:
      - .github/workflows/converge-hosted-runtime.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Persist combined Agent and hosted runtime integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          def main_file(path):
              return subprocess.check_output(["git", "show", f"origin/main:{path}"], text=True)

          def replace_once(path, before, after):
              p = Path(path)
              text = p.read_text()
              if after in text:
                  return
              if before not in text:
                  raise SystemExit(f"Expected integration anchor missing in {path}: {before!r}")
              p.write_text(text.replace(before, after, 1))

          # Restore the shared provider transport required by hosted gateway models.
          path = Path('src/infrastructure/ai-provider.ts')
          text = path.read_text()
          if 'import { providerFetch } from "./provider-transport";' not in text:
              anchor = 'import { generateWithKingsAi } from "./kings-ai-bridge";'
              if anchor not in text:
                  raise SystemExit('K.I.N.G.S. provider import anchor missing')
              text = text.replace(anchor, anchor + '\nimport { providerFetch } from "./provider-transport";', 1)
          path.write_text(text)

          # Restore Agent Workbench + Design/Motion launch surfaces while retaining hosted routing.
          replace_once(
              'public/forge-pwa.js',
              'const HOSTED_PORT_PATHS=Object.freeze({4273:"/journal",4373:"/workbooks",4473:"/specialized"});',
              'const HOSTED_PORT_PATHS=Object.freeze({4273:"/journal",4373:"/workbooks",4473:"/specialized",4573:"/nft"});'
          )
          path = Path('public/forge-pwa.js')
          text = path.read_text()
          if 'function ensureAgentNavigation()' not in text:
              anchor = '  function ensureSeriesNavigation()'
              addition = '  function ensureAgentNavigation(){if(!document.getElementById("dashboard"))return;const nav=document.querySelector(".sidebar nav");if(!nav)return;let link=document.getElementById("open-agent-workbench");if(!link){link=document.createElement("a");link.id="open-agent-workbench";link.textContent="Agent Workbench";link.dataset.icon="⚒";const writing=nav.querySelector(\'[data-route="writing"]\');nav.insertBefore(link,writing||nav.firstChild);}link.href=projectUrl("/forge-agent.html");}\n  function ensureMediaNavigation(){if(!document.getElementById("dashboard"))return;const nav=document.querySelector(".sidebar nav");if(!nav)return;let link=document.getElementById("open-design-motion");if(!link){link=document.createElement("a");link.id="open-design-motion";link.textContent="Design & Motion";link.dataset.icon="◈";const art=nav.querySelector(\'[data-route="art"]\');nav.insertBefore(link,art||null);}link.href=projectUrl("/forge-media-studio.html");}\n'
              if anchor not in text:
                  raise SystemExit('PWA navigation anchor missing')
              text = text.replace(anchor, addition + anchor, 1)
          if 'open-agent-workbench-dashboard' not in text:
              marker = '<div class="row">'
              links = '<a class="forge-office-link" id="open-agent-workbench-dashboard" href="${projectUrl("/forge-agent.html")}">Agent Workbench</a><a class="forge-office-link" id="open-design-motion-dashboard" href="${projectUrl("/forge-media-studio.html")}">Design & Motion Offices</a>'
              if marker not in text:
                  raise SystemExit('PWA launcher row anchor missing')
              text = text.replace(marker, marker + links, 1)
          if 'id="open-nft-office"' not in text:
              marker = '<a class="forge-office-link" id="open-specialized-office" href="${officeUrl(4473)}" target="_blank" rel="noopener">Specialized Creation</a>'
              if marker not in text:
                  raise SystemExit('Specialized launcher anchor missing')
              text = text.replace(marker, marker + '<a class="forge-office-link" id="open-nft-office" href="${officeUrl(4573)}" target="_blank" rel="noopener">NFT Creation</a>', 1)
          text = text.replace(
              'ensureRoyalHardeningStyles();ensureSeriesNavigation();ensureOfficeLauncher();',
              'ensureRoyalHardeningStyles();ensureAgentNavigation();ensureMediaNavigation();ensureSeriesNavigation();ensureOfficeLauncher();'
          )
          path.write_text(text)

          # Use main's complete browser contract, preserving hosted operator commands.
          hosted_package = json.loads(Path('package.json').read_text())
          package = json.loads(main_file('package.json'))
          for key in ('forge:web','forge:web:prepared','forge:doctor','forge:doctor:json','forge:sandbox','forge:codespaces','forge:ssh'):
              if key in hosted_package.get('scripts', {}):
                  package['scripts'][key] = hosted_package['scripts'][key]
          Path('package.json').write_text(json.dumps(package, indent=2) + '\n')

          # Restore Creative Agent routes into the richer hosted Studio composition.
          path = Path('src/application/studio-publishing-promotion-routes.ts')
          text = path.read_text()
          if 'createStudioCreativeAgentRoutes' not in text:
              text = text.replace(
                  'import { createStudioChapterCardWorkflowRoutes } from "./studio-chapter-card-workflow-routes";',
                  'import { createStudioChapterCardWorkflowRoutes } from "./studio-chapter-card-workflow-routes";\nimport { createStudioCreativeAgentRoutes } from "./studio-creative-agent-routes";', 1
              )
              text = text.replace(
                  '  const authorCraft = createStudioAuthorCraftRoutes(store);',
                  '  const authorCraft = createStudioAuthorCraftRoutes(store);\n  const creativeAgent = createStudioCreativeAgentRoutes(store);', 1
              )
              text = text.replace(
                  '    if (await authorCraft(req, res, url, projectId)) return true;',
                  '    if (await authorCraft(req, res, url, projectId)) return true;\n    if (await creativeAgent(req, res, url, projectId)) return true;', 1
              )
          path.write_text(text)

          # Carry every current main PWA asset into local and hosted offline shells.
          main_sw = main_file('public/sw.js')
          shell_match = re.search(r'const SHELL = \[(.*?)\];', main_sw, re.S)
          main_assets = re.findall(r'"(/[^"]+)"', shell_match.group(1) if shell_match else '')
          for sw_name in ('public/sw.js', 'public/sw-hosted.js'):
              sw_path = Path(sw_name)
              sw = sw_path.read_text()
              current_match = re.search(r'const SHELL = \[(.*?)\];', sw, re.S)
              if not current_match:
                  raise SystemExit(f'Offline shell list missing in {sw_name}')
              current = set(re.findall(r'"(/[^"]+)"', current_match.group(1)))
              missing = [asset for asset in main_assets if asset not in current]
              if missing:
                  insertion = ''.join(f',\n  {json.dumps(asset)}' for asset in missing)
                  end = current_match.end(1)
                  body = sw[:end].rstrip()
                  if body.endswith(','):
                      insertion = insertion.lstrip(',')
                  sw = body + insertion + sw[end:]
              sw_path.write_text(sw)

          # Make NFT Creation a real fifth hosted office on the same authenticated origin.
          replace_once('scripts/forge-web-gateway.js', '  Object.freeze({ id: "specialized", prefix: "/specialized" }),\n', '  Object.freeze({ id: "specialized", prefix: "/specialized" }),\n  Object.freeze({ id: "nft", prefix: "/nft" }),\n')
          replace_once('scripts/start-forge-web.js', '  { id: "specialized", name: "Specialized Creation", entry: "dist/specialized-creation-server.js", portKey: "SPECIALIZED_PORT" },\n', '  { id: "specialized", name: "Specialized Creation", entry: "dist/specialized-creation-server.js", portKey: "SPECIALIZED_PORT" },\n  { id: "nft", name: "NFT Creation", entry: "dist/nft-creation-server.js", portKey: "NFT_PORT" },\n')
          replace_once('public/forge-hosted-client.js', '  const OFFICE_PREFIXES = ["/journal", "/workbooks", "/specialized"];', '  const OFFICE_PREFIXES = ["/journal", "/workbooks", "/specialized", "/nft"];')
          replace_once('public/forge-hosted-client.js', '    "4473": "/specialized/",\n', '    "4473": "/specialized/",\n    "4573": "/nft/",\n')
          replace_once('public/sw-hosted.js', 'const OFFICE_API = /^\\/(?:journal|workbooks|specialized)\\/api(?:\\/|$)/;', 'const OFFICE_API = /^\\/(?:journal|workbooks|specialized|nft)\\/api(?:\\/|$)/;')
          replace_once('public/sw-hosted.js', '        if (url.pathname.startsWith("/specialized/")) return (await caches.match("/specialized/")) || caches.match("/index.html");\n', '        if (url.pathname.startsWith("/specialized/")) return (await caches.match("/specialized/")) || caches.match("/index.html");\n        if (url.pathname.startsWith("/nft/")) return (await caches.match("/nft/")) || caches.match("/index.html");\n')

          replace_once('test/forge-web-gateway.test.js', '  assert.equal(resolveHostedRoute("/specialized/api/projects/book-1").serviceId, "specialized");\n', '  assert.equal(resolveHostedRoute("/specialized/api/projects/book-1").serviceId, "specialized");\n  assert.equal(resolveHostedRoute("/nft/api/projects/book-1/nft").serviceId, "nft");\n')
          replace_once('test/forge-web-gateway.test.js', '  const specialized = await fetch(`${base}/specialized/`, { headers: authHeaders });\n  assert.equal(specialized.status, 200);\n', '  const specialized = await fetch(`${base}/specialized/`, { headers: authHeaders });\n  assert.equal(specialized.status, 200);\n\n  const nft = await fetch(`${base}/nft/`, { headers: authHeaders });\n  assert.equal(nft.status, 200);\n  const nftHtml = await nft.text();\n  assert.match(nftHtml, /\\/nft\\/nft-creation\\.css/);\n  assert.match(nftHtml, /forge-hosted-client\\.js/);\n\n  const nftCss = await fetch(`${base}/nft/nft-creation.css`, { headers: authHeaders });\n  assert.equal(nftCss.status, 200);\n  assert.match(String(nftCss.headers.get("content-type")), /text\\/css/);\n')
          replace_once('test/forge-web-gateway.test.js', '  assert.match(hostedWorkerSource, /journal\\|workbooks\\|specialized/);', '  assert.match(hostedWorkerSource, /journal\\|workbooks\\|specialized\\|nft/);')
          PY
          git add -A
          git diff --cached --check
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit verification
        run: npm test
      - name: Commit and push integrated release candidate
        run: |
          git commit -m "Persist Agent and hosted runtime release convergence"
          git push origin HEAD:chief/android-ps5-web-runtime
