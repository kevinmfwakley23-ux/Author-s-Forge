name: Converge Hosted Runtime

# One-time release convergence helper. Remove before final merge.
on:
  push:
    branches:
      - chief/android-ps5-web-runtime
    paths:
      - .github/workflows/converge-hosted-runtime.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Add NFT Office to hosted single-origin runtime
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              p = Path(path)
              text = p.read_text()
              if after in text:
                  return
              if before not in text:
                  raise SystemExit(f"Expected integration anchor missing in {path}: {before!r}")
              p.write_text(text.replace(before, after, 1))

          replace_once(
              'scripts/forge-web-gateway.js',
              '  Object.freeze({ id: "specialized", prefix: "/specialized" }),\n',
              '  Object.freeze({ id: "specialized", prefix: "/specialized" }),\n  Object.freeze({ id: "nft", prefix: "/nft" }),\n'
          )
          replace_once(
              'scripts/start-forge-web.js',
              '  { id: "specialized", name: "Specialized Creation", entry: "dist/specialized-creation-server.js", portKey: "SPECIALIZED_PORT" },\n',
              '  { id: "specialized", name: "Specialized Creation", entry: "dist/specialized-creation-server.js", portKey: "SPECIALIZED_PORT" },\n  { id: "nft", name: "NFT Creation", entry: "dist/nft-creation-server.js", portKey: "NFT_PORT" },\n'
          )
          replace_once(
              'public/forge-hosted-client.js',
              '  const OFFICE_PREFIXES = ["/journal", "/workbooks", "/specialized"];',
              '  const OFFICE_PREFIXES = ["/journal", "/workbooks", "/specialized", "/nft"];'
          )
          replace_once(
              'public/forge-hosted-client.js',
              '    "4473": "/specialized/",\n',
              '    "4473": "/specialized/",\n    "4573": "/nft/",\n'
          )
          replace_once(
              'public/sw-hosted.js',
              'const OFFICE_API = /^\\/(?:journal|workbooks|specialized)\\/api(?:\\/|$)/;',
              'const OFFICE_API = /^\\/(?:journal|workbooks|specialized|nft)\\/api(?:\\/|$)/;'
          )
          replace_once(
              'public/sw-hosted.js',
              '        if (url.pathname.startsWith("/specialized/")) return (await caches.match("/specialized/")) || caches.match("/index.html");\n',
              '        if (url.pathname.startsWith("/specialized/")) return (await caches.match("/specialized/")) || caches.match("/index.html");\n        if (url.pathname.startsWith("/nft/")) return (await caches.match("/nft/")) || caches.match("/index.html");\n'
          )
          replace_once(
              'test/forge-web-gateway.test.js',
              '  assert.equal(resolveHostedRoute("/specialized/api/projects/book-1").serviceId, "specialized");\n',
              '  assert.equal(resolveHostedRoute("/specialized/api/projects/book-1").serviceId, "specialized");\n  assert.equal(resolveHostedRoute("/nft/api/projects/book-1/nft").serviceId, "nft");\n'
          )
          replace_once(
              'test/forge-web-gateway.test.js',
              '  const specialized = await fetch(`${base}/specialized/`, { headers: authHeaders });\n  assert.equal(specialized.status, 200);\n',
              '  const specialized = await fetch(`${base}/specialized/`, { headers: authHeaders });\n  assert.equal(specialized.status, 200);\n\n  const nft = await fetch(`${base}/nft/`, { headers: authHeaders });\n  assert.equal(nft.status, 200);\n  const nftHtml = await nft.text();\n  assert.match(nftHtml, /\\/nft\\/nft-creation\\.css/);\n  assert.match(nftHtml, /forge-hosted-client\\.js/);\n\n  const nftCss = await fetch(`${base}/nft/nft-creation.css`, { headers: authHeaders });\n  assert.equal(nftCss.status, 200);\n  assert.match(String(nftCss.headers.get("content-type")), /text\\/css/);\n'
          )
          replace_once(
              'test/forge-web-gateway.test.js',
              '  assert.match(hostedWorkerSource, /journal\\|workbooks\\|specialized/);',
              '  assert.match(hostedWorkerSource, /journal\\|workbooks\\|specialized\\|nft/);'
          )
          PY
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit verification
        run: npm test
      - name: Commit and push hosted NFT integration
        run: |
          git add scripts/forge-web-gateway.js scripts/start-forge-web.js public/forge-hosted-client.js public/sw-hosted.js test/forge-web-gateway.test.js
          git commit -m "Add NFT Office to hosted single-origin runtime"
          git push origin HEAD:chief/android-ps5-web-runtime
