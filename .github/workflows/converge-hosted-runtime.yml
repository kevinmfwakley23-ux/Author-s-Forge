name: Converge Hosted Runtime

on:
  push:
    branches:
      - chief/android-ps5-web-runtime
    paths:
      - .github/workflows/converge-hosted-runtime.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Merge current main into hosted runtime lane
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -X ours origin/main
          if git ls-files -u | grep -q .; then
            echo "Unresolved merge conflicts remain:" >&2
            git status --short >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('src/infrastructure/ai-provider.ts')
          text = path.read_text()
          text = text.replace(
              'import { discoverConfiguredAiModelResources } from "./ai-model-resources";',
              'import { discoverConfiguredAiModelResources, discoverConfiguredAiProviderQuotas } from "./ai-model-resources";'
          )
          if 'import { providerFetch } from "./provider-transport";' not in text:
              anchor = 'import { generateWithKingsAi } from "./kings-ai-bridge";'
              text = text.replace(anchor, anchor + '\nimport { providerFetch } from "./provider-transport";')
          if 'const providerQuotas = discoverConfiguredAiProviderQuotas(process.env);' not in text:
              text = text.replace(
                  '  const resources = discoverConfiguredAiModelResources(process.env);\n  liveBroker.setResources(resources);',
                  '  const resources = discoverConfiguredAiModelResources(process.env);\n  const providerQuotas = discoverConfiguredAiProviderQuotas(process.env);\n  liveBroker.setResources(resources);\n  liveBroker.setProviderQuotas(providerQuotas);'
              )
          if 'export function aiConfiguredProviderQuotas()' not in text:
              anchor = 'type ProviderName = AiGenerationResult["provider"];'
              insertion = '/** Effective provider/account quotas after all routed model usage is aggregated. */\nexport function aiConfiguredProviderQuotas() {\n  refreshLiveBroker();\n  return liveBroker.listProviderQuotas();\n}\n\n'
              text = text.replace(anchor, insertion + anchor)
          path.write_text(text)
          PY
          git rm .github/workflows/converge-hosted-runtime.yml
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit verification
        run: npm test
      - name: Commit and push convergence
        run: |
          git commit -m "Merge current main into hosted runtime release lane"
          git push origin HEAD:chief/android-ps5-web-runtime
