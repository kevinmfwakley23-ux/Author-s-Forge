name: Canonical Forge Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forge-main-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
      - name: Setup validated Node LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Verify runtime contract
        run: npm run runtime:check
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run strongest Forge verification gate
        run: npm run verify
