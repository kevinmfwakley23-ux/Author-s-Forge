name: Forge Android Native APK

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "src-tauri/**"
      - "native-shell/**"
      - "scripts/build-forge.js"
      - "scripts/generate-launcher-icons.js"
      - "scripts/prepare-android-embedded-runtime.js"
      - "scripts/android-node18-runtime-smoke.js"
      - "test/android-native-runtime-contract.test.js"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/android-native.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "src-tauri/**"
      - "native-shell/**"
      - "scripts/build-forge.js"
      - "scripts/generate-launcher-icons.js"
      - "scripts/prepare-android-embedded-runtime.js"
      - "scripts/android-node18-runtime-smoke.js"
      - "test/android-native-runtime-contract.test.js"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installable-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      TAURI_CLI_VERSION: "2.11.4"
      ANDROID_NDK_VERSION: "27.0.12077973"
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_CMAKE_VERSION: "3.22.1"
      NODEJS_MOBILE_VERSION: "18.20.4"
      NODEJS_MOBILE_ANDROID_SIZE: "57287354"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7

      - name: Setup validated Forge build runtime
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked Forge dependencies
        run: npm ci

      - name: Build real Forge runtime and native startup surface
        run: |
          npm run runtime:check
          npm run build
          node --check native-shell/app.js
          node --check scripts/prepare-android-embedded-runtime.js
          node --check scripts/android-node18-runtime-smoke.js
          ! grep -RniE 'forge\.example\.com|id="forge-url"|Enter the HTTPS address' native-shell
          grep -q 'Opening your Forge' native-shell/index.html
          grep -q 'One place to finish the book' public/index.html

      - name: Setup embedded Node compatibility runtime
        uses: actions/setup-node@v7
        with:
          node-version: "18.20.4"

      - name: Prove compiled Forge server runs on embedded Node version
        run: node scripts/android-node18-runtime-smoke.js

      - name: Restore validated Forge build runtime
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages required by Tauri and embedded Node bridge
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup supported Rust Android targets
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android

      - name: Cache Cargo downloads and native target output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: forge-android-embedded-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/tauri.conf.json', 'src-tauri/tauri.android.conf.json', 'scripts/prepare-android-embedded-runtime.js') }}

      - name: Install pinned Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Generate native launcher icons
        shell: bash
        run: |
          set -euo pipefail
          test -f public/icon-512.png
          cargo tauri icon public/icon-512.png

      - name: Initialize deterministic Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src-tauri/gen/android
          cargo tauri android init --ci --skip-targets-install
          test -f src-tauri/gen/android/app/build.gradle.kts

      - name: Download pinned Node.js Mobile Android runtime
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/nodejs-mobile-v${NODEJS_MOBILE_VERSION}-android.zip"
          URL="https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v${NODEJS_MOBILE_VERSION}/nodejs-mobile-v${NODEJS_MOBILE_VERSION}-android.zip"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$ARCHIVE"
          test "$(stat -c%s "$ARCHIVE")" = "$NODEJS_MOBILE_ANDROID_SIZE"
          sha256sum "$ARCHIVE"
          rm -rf .android-nodejs-mobile
          mkdir -p .android-nodejs-mobile
          unzip -q "$ARCHIVE" -d .android-nodejs-mobile

      - name: Assemble standalone embedded Forge runtime
        shell: bash
        run: |
          set -euo pipefail
          NODEJS_MOBILE_DIR="$PWD/.android-nodejs-mobile" node scripts/prepare-android-embedded-runtime.js
          test -f src-tauri/gen/android/app/src/main/assets/nodejs-project/main.js
          test -f src-tauri/gen/android/app/src/main/assets/nodejs-project/dist/studio-server.js
          test -f src-tauri/gen/android/app/src/main/assets/nodejs-project/public/index.html
          test -f src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libnode.so
          test -f src-tauri/gen/android/app/src/main/jniLibs/armeabi-v7a/libnode.so
          test -f src-tauri/gen/android/app/src/main/jniLibs/x86_64/libnode.so
          test -f src-tauri/gen/android/app/src/main/cpp/forge_node_bridge.cpp
          test -f src-tauri/gen/android/app/CMakeLists.txt
          grep -q 'One place to finish the book' src-tauri/gen/android/app/src/main/assets/nodejs-project/public/index.html
          grep -Rqs 'http://127.0.0.1:4173/api/health' src-tauri/gen/android/app/src/main/java
          ! grep -Rqs 'forge.example.com' src-tauri/gen/android/app/src/main/assets/nodejs-project

      - name: Build installable standalone Android APK
        shell: bash
        run: |
          set -euo pipefail
          cargo tauri android build --debug --apk --ci \
            --target aarch64 \
            --target armv7 \
            --target x86_64

      - name: Verify APK contains real Studio and embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "Tauri completed without producing an APK." >&2
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libnode.so'
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libforge_node_bridge.so'
            unzip -l "$apk" | grep -q 'assets/nodejs-project/main.js'
            unzip -l "$apk" | grep -q 'assets/nodejs-project/dist/studio-server.js'
            unzip -l "$apk" | grep -q 'assets/nodejs-project/public/index.html'
            unzip -p "$apk" assets/nodejs-project/public/index.html | grep -q 'One place to finish the book'
          done

      - name: Verify APK signatures and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-artifacts
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "$APKSIGNER"
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "Tauri completed without producing an APK." >&2
            exit 1
          fi
          : > android-artifacts/SHA256SUMS
          for apk in "${APKS[@]}"; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            cp "$apk" android-artifacts/
            sha256sum "$apk" >> android-artifacts/SHA256SUMS
          done
          printf 'Verified %s standalone Forge APK artifact(s).\n' "${#APKS[@]}"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: authors-forge-standalone-android-${{ github.sha }}
          path: android-artifacts/
          if-no-files-found: error
          retention-days: 30
