name: Forge Release Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release ref to belong to main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to package Author's Forge: $GITHUB_SHA is not contained in origin/main history." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium acceptance runtime
        run: npx playwright install --with-deps chromium

      - name: Run strongest Forge verification gate
        run: npm run verify

      - name: Validate release launcher and workflow scripts
        run: |
          node --check public/forge-chapter-card-workflow.js
          node --check public/forge-chapter-card-approval.js
          node --check public/forge-manuscript-import.js
          node --check public/forge-pwa.js
          node --check public/sw.js
          node --check scripts/forge-network-security.js
          node --check scripts/start-forge.js
          node --check scripts/studio-manuscript-import-browser-acceptance.js
          bash -n scripts/termux-forge.sh

      - name: Assemble Android/Chromebook portable bundle
        run: |
          set -euo pipefail
          rm -rf release-bundle
          mkdir -p release-bundle/forge
          cp -R dist release-bundle/forge/dist
          cp -R public release-bundle/forge/public
          cp package.json package-lock.json release-bundle/forge/
          cp -R scripts release-bundle/forge/scripts
          cp README.md AUTHORS_FORGE_MASTER_PRODUCT_DIRECTIVE.md release-bundle/forge/
          cat > release-bundle/forge/RUN-FORGE.md <<'EOF'
          # Run Author's Forge

          This bundle was assembled only after its exact Git commit passed Author's Forge's strongest repository verification gate: build, baseline, complete regression tests, completion checks, full desktop browser acceptance, and Android/mobile browser acceptance.

          ## Chromebook/Linux — complete workplace
          npm install
          npm run forge
          Open http://127.0.0.1:4173/

          The Main Studio includes the durable Series Engine and the author-directed Chapter Card workflow. An author can give Forge a book description plus known events and timeline details, have real AI create structured Chapter Cards, edit/review them, explicitly approve the exact current cards, then either write manually from those cards or request AI chapter drafts. AI chapter drafts remain durable proposals for author review and do not overwrite existing manuscript prose.

          The Main Studio can also bring an existing DOCX, UTF-8 TXT, or Markdown manuscript into Forge through a preview-first intake workflow. Forge detects chapter and scene structure, records source filename/hash provenance in the imported book, and creates a new durable book only after explicit author action; existing Forge books are not overwritten by manuscript intake.

          The unified launcher also starts the project-aware Guided Journal, Educational Workbook, and Specialized Creation offices on ports 4273, 4373, and 4473. Open those offices from the Main Studio dashboard so the current project id is carried forward automatically.

          The main Studio Illustration surface includes the durable Image Lab. Real image generation/editing requires an explicitly configured supported image provider credential; when unavailable Forge reports that condition and does not fabricate artwork.

          ## Android / Termux or trusted LAN/device access
          npm install
          npm run forge:android

          Non-loopback mode is protected. Do not open a plain device URL first. The launcher prints a bootstrap URL in this form:

          http://<device-ip>:4173/?access=<generated-token>

          Open that exact printed URL first. Forge strips the token from the address bar and sets an HttpOnly SameSite=Strict host cookie that also authorizes the companion office ports. Anonymous or wrong-token requests receive 401 before reaching project APIs.

          You can set FORGE_ACCESS_TOKEN yourself before launch; it must be at least 24 characters. Otherwise Forge generates a strong random token for the launcher run.

          Termux users can run `bash scripts/termux-forge.sh`; it generates/reuses the token and prints the correct phone bootstrap URL. The supported `studio:android`, `studio:journal:android`, `studio:workbooks:android`, and `studio:specialized:android` commands use the same protected boundary.

          The access token prevents anonymous LAN access but does not encrypt plain HTTP. Use this mode only on a trusted local network. Use an authenticated encrypted tunnel or HTTPS reverse proxy for untrusted/remote networks.

          The individual loopback `studio`, `studio:journal`, `studio:workbooks`, and `studio:specialized` commands remain available for engineering and isolated-office use.

          Forge project data is persisted by the Forge servers under the shared Forge data root. The PWA shell may be installed by the browser, but service-worker caching never replaces server-side project persistence and `/api/` project data is not cached as durable state.
          EOF
          tar -C release-bundle -czf "authors-forge-${GITHUB_SHA::12}.tar.gz" forge
          sha256sum "authors-forge-${GITHUB_SHA::12}.tar.gz" > "authors-forge-${GITHUB_SHA::12}.sha256"

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: authors-forge-${{ github.sha }}
          path: |
            authors-forge-*.tar.gz
            authors-forge-*.sha256
          if-no-files-found: error
          retention-days: 30
