name: Author's Forge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit and contract regression
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Studio browser acceptance
        run: npm run test:browser

      - name: Studio mobile acceptance
        run: npm run test:browser:mobile
