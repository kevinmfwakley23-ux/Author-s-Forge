name: Forge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run baseline
      - name: Diagnose manuscript Markdown parsing
        run: node --test --test-name-pattern="Markdown manuscript preview" test/studio-manuscript-import.test.js
      - name: Diagnose manuscript DOCX parsing
        run: node --test --test-name-pattern="DOCX manuscript preview" test/studio-manuscript-import.test.js
      - name: Diagnose manuscript durable application
        run: node --test --test-name-pattern="applying a preview" test/studio-manuscript-import.test.js
      - name: Diagnose manuscript prefix preservation
        run: node --test --test-name-pattern="content before the first detected chapter" test/studio-manuscript-import.test.js
      - name: Diagnose manuscript failure handling
        run: node --test --test-name-pattern="unsupported, malformed, and oversized" test/studio-manuscript-import.test.js
      - run: npm test
      - run: npm run completion
      - run: node --check public/app.js
      - run: node --check public/forge-command-center.js
      - run: node --check public/forge-workbench.js
      - run: node --check public/forge-ai-proposals.js
      - run: node --check public/forge-editing-proposals.js
      - run: node --check public/forge-story-map.js
      - run: node --check public/forge-chapter-cards.js
      - run: node --check public/forge-chapter-card-workflow.js
      - run: node --check public/forge-chapter-card-approval.js
      - run: node --check public/forge-manuscript-import.js
      - run: node --check public/forge-series.js
      - run: node --check public/forge-image-lab.js
      - run: node --check public/forge-kdp-preflight.js
      - run: node --check public/forge-publishing-promotion.js
      - run: node --check public/forge-promotion-performance.js
      - run: node --check public/author-craft.js
      - run: node --check public/forge-pwa.js
      - run: node --check public/sw.js
      - run: node --check scripts/forge-network-security.js
      - run: node --check scripts/start-forge.js
      - run: node --check scripts/forge-offices-browser-acceptance.js
      - run: node --check scripts/studio-series-browser-acceptance.js
      - run: node --check scripts/studio-manuscript-import-browser-acceptance.js
      - run: node --check scripts/studio-image-lab-browser-acceptance.js
      - run: node --check scripts/studio-author-craft-browser-acceptance.js
      - run: bash -n scripts/termux-forge.sh

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser:mobile
