name: Forge Main Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-main-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run runtime:check
      - run: npm run test:main
      - run: npm run baseline
      - run: npm run completion
      - run: node --check public/app.js
      - run: node --check public/forge-command-center.js
      - run: node --check public/forge-workbench.js
      - run: node --check public/forge-agent-v3.js
      - run: node --check public/forge-agent-routing.js
      - run: node --check public/forge-ai-proposals.js
      - run: node --check public/forge-editing-proposals.js
      - run: node --check public/forge-story-map.js
      - run: node --check public/forge-story-architecture.js
      - run: node --check public/forge-chapter-cards.js
      - run: node --check public/forge-chapter-card-workflow.js
      - run: node --check public/forge-chapter-card-approval.js
      - run: node --check public/forge-scene-cards.js
      - run: node --check public/forge-manuscript-import.js
      - run: node --check public/forge-series.js
      - run: node --check public/forge-image-lab.js
      - run: node --check public/forge-ai-gateways.js
      - run: node --check public/forge-model-freedom.js
      - run: node --check public/forge-recipes.js
      - run: node --check public/forge-review-room.js
      - run: node --check public/forge-reviewer.js
      - run: node --check public/forge-provenance.js
      - run: node --check public/forge-brand-studio.js
      - run: node --check public/forge-kdp-preflight.js
      - run: node --check public/forge-publishing-promotion.js
      - run: node --check public/forge-promotion-performance.js
      - run: node --check public/author-craft.js
      - run: node --check public/forge-pwa.js
      - run: node --check public/forge-royal-ui.js
      - run: node --check public/sw.js
      - run: node --check public/sw-hosted.js
      - run: node --check native-shell/app.js
      - run: node --check scripts/require-node24.js
      - run: node --check scripts/forge-network-security.js
      - run: node --check scripts/start-forge.js
      - run: node --check scripts/start-forge-web.js
      - run: node --check scripts/forge-platform-doctor.js
      - run: node --check scripts/forge-sandbox.js
      - run: node --check scripts/forge-codespaces.js
      - run: node --check scripts/forge-ssh.js
      - run: node --check scripts/run-main-tests.js
      - run: node --check scripts/forge-main-baseline-check.js
      - run: node --check scripts/forge-main-completion.js
      - run: node --check scripts/hosted-main-studio-browser-acceptance.js
      - run: node --check scripts/hosted-main-webkit-mobile-acceptance.js
      - run: node --check scripts/studio-agent-planner-api-acceptance.js
      - run: node --check scripts/studio-agent-routing-browser-acceptance.js
      - run: node --check scripts/studio-agent-workbench-browser-acceptance.js
      - run: node --check scripts/studio-architecture-browser-acceptance.js
      - run: node --check scripts/studio-brand-kit-browser-acceptance.js
      - run: node --check scripts/studio-scene-card-browser-acceptance.js
      - run: node --check scripts/studio-series-browser-acceptance.js
      - run: node --check scripts/studio-manuscript-import-browser-acceptance.js
      - run: node --check scripts/studio-image-lab-browser-acceptance.js
      - run: node --check scripts/studio-cover-direction-browser-acceptance.js
      - run: node --check scripts/studio-author-craft-browser-acceptance.js
      - run: bash -n scripts/termux-forge.sh

  browser-acceptance-main-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify-main-studio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run runtime:check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run test:browser:mobile
