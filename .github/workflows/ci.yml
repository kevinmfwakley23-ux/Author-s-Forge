name: Forge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run baseline
      - run: npm test
      - run: npm run completion
      - run: node --check public/app.js
      - run: node --check public/forge-command-center.js
      - run: node --check public/forge-workbench.js
      - run: node --check public/forge-ai-proposals.js
      - run: node --check public/forge-editing-proposals.js
      - run: node --check public/forge-kdp-preflight.js
      - run: node --check public/forge-publishing-promotion.js
      - run: node --check public/forge-promotion-performance.js
      - run: node --check public/forge-pwa.js
      - run: node --check public/sw.js
      - run: node --check scripts/start-forge.js
      - run: node --check scripts/forge-offices-browser-acceptance.js
      - run: bash -n scripts/termux-forge.sh

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser:mobile
