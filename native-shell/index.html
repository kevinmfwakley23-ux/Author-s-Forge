<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5ef" />
  <title>K.I.N.G.S. Author's Forge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="forge-boot" aria-labelledby="forge-title">
    <section class="forge-brand">
      <div class="crest-frame">
        <img class="official-logo" src="assets/brand/kings-authors-forge-official-512.png" alt="K.I.N.G.S. Author's Forge official crest" />
      </div>
      <p class="eyebrow">K.I.N.G.S.</p>
      <h1 id="forge-title">AUTHOR'S <span>FORGE</span></h1>
      <p class="subtitle">AI authoring · editing · publishing studio</p>
    </section>

    <section class="startup-card" aria-labelledby="startup-title">
      <div class="gold-line" aria-hidden="true"></div>
      <h2 id="startup-title">Opening your Forge</h2>
      <p id="status" class="status" role="status" aria-live="polite">Starting the private Forge Core on this device…</p>
      <div class="progress" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="detail">Your real Studio is starting inside this app. No hosted address and no Termux are required.</p>
      <button id="retry" type="button" hidden>Retry Forge startup</button>
    </section>

    <footer>
      <span>KNOWLEDGE</span><i>•</i><span>INVESTIGATION</span><i>•</i><span>NARRATIVE</span><i>•</i><span>GENERATION</span><i>•</i><span>SYSTEM</span>
    </footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
