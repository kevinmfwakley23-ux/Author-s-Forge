[package]
name = "authors-forge-native"
version = "0.1.0"
description = "K.I.N.G.S. Author's Forge native desktop and mobile runtime"
authors = ["K.I.N.G.S. Author's Forge"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "authors_forge_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "authors-forge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-fs = "=2.5.2"
tauri-plugin-http = "=2.6.0"
tauri-plugin-store = "=2.4.4"
tauri-plugin-stronghold = "=2.3.2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev.package.scrypt]
opt-level = 3
