[package]
name = "authors-forge-native"
version = "0.1.0"
description = "Author's Forge native desktop and mobile shell"
authors = ["Author's Forge"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "authors_forge_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "authors-forge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
